name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    env_file: .env
    environment:
      # Externer Host plus interne Namen: die eigene Kachel fragt sich selbst ab.
      HOMEPAGE_ALLOWED_HOSTS: ${DASH_HOST},homepage:3000,127.0.0.1:3000,localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config:/app/config
      # Lesend: das Dashboard zeigt Container-Status, steuert aber nichts.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homeserver

networks:
  # Bestehendes Netz der Stack-Compose; kein zweites Netz aufspannen.
  homeserver:
    external: true
    name: homeserver_default
